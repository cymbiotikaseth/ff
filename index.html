<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Draft Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080f14; --bg:#0b141b; --bg2:#101c25; --bg3:#16242f; --bg4:#1d2f3c;
  --line:#22374a; --line2:#2c465c;
  --tx:#d6e4ee; --tx2:#8ba3b6; --tx3:#5e7789;
  --accent:#3ad6c0; --accent2:#0d5c56;
  --urgent:#ff8a5b; --danger:#ff5d6c; --good:#5fd68a;
  --QB:#e0728f; --RB:#4fc4a6; --WR:#5aa6e0; --TE:#e5a24d; --K:#9b8ec4; --DST:#8a94a6;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --sans:"Inter",system-ui,sans-serif;
  --rowh:22px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:12px;overflow:hidden}
button{font-family:var(--cond);font-size:12px;letter-spacing:.04em;text-transform:uppercase;
  background:var(--bg3);color:var(--tx);border:1px solid var(--line);border-radius:3px;
  padding:3px 8px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--bg4);border-color:var(--line2)}
button:active{transform:translateY(1px)}
button[disabled]{opacity:.35;cursor:default}
button.db-on{background:var(--accent2);border-color:var(--accent);color:#eafffb}
input{font-family:var(--sans);background:var(--ink);color:var(--tx);border:1px solid var(--line);
  border-radius:3px;padding:4px 7px;font-size:12px}
input:focus{outline:none;border-color:var(--accent)}
select{font-family:var(--cond);text-transform:uppercase;letter-spacing:.04em;background:var(--bg3);
  color:var(--tx);border:1px solid var(--line);border-radius:3px;padding:3px 6px;font-size:12px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:#2b4459;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#3a5a75}

/* ---------- layout ---------- */
#db-app{display:flex;flex-direction:column;height:100vh}
#db-top{flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--bg2)}
#db-main{flex:1 1 auto;display:flex;min-height:0}
#db-left{flex:0 0 232px;border-right:1px solid var(--line);background:var(--bg2);overflow-y:auto}
#db-center{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
#db-right{flex:0 0 250px;border-left:1px solid var(--line);background:var(--bg2);overflow-y:auto}
body.db-noleft #db-left,body.db-noright #db-right{display:none}

/* ---------- top bar ---------- */
.db-bar{display:flex;align-items:center;gap:9px;padding:6px 9px}
#db-top.db-myturn{background:linear-gradient(90deg,#0d5c56,#0b141b 62%);animation:dbpulse 1.5s ease-in-out infinite}
@keyframes dbpulse{0%,100%{box-shadow:inset 0 0 0 0 rgba(58,214,192,0)}50%{box-shadow:inset 0 2px 0 0 var(--accent)}}
.db-pk{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1}
.db-prog{font-family:var(--mono);font-size:10px;color:var(--tx2);line-height:1.3}
.db-lab{font-family:var(--cond);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx3)}
.db-clock{font-family:var(--cond);font-size:17px;font-weight:600;letter-spacing:.02em;line-height:1.1}
#db-top.db-myturn .db-clock{color:var(--accent)}
.db-sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.db-grow{flex:1 1 auto}
#db-search{width:100%;font-family:var(--mono);font-size:12px}
.db-searchwrap{position:relative;flex:1 1 200px;max-width:330px;min-width:120px}
#db-sugg{position:absolute;top:100%;left:0;right:0;z-index:60;background:var(--bg3);
  border:1px solid var(--line2);border-top:none;border-radius:0 0 3px 3px;max-height:290px;overflow-y:auto;display:none}
#db-sugg.db-open{display:block}
.db-sg{display:flex;align-items:center;gap:6px;padding:3px 7px;cursor:pointer;font-size:12px}
.db-sg.db-sel{background:var(--bg4)}
.db-sg:hover{background:var(--bg4)}
.db-save{font-family:var(--mono);font-size:10px;color:var(--tx3);width:58px;flex:0 0 58px;text-align:right}
.db-save.db-dirty{color:var(--urgent)}

/* ---------- panels ---------- */
.db-panel{border-bottom:1px solid var(--line)}
.db-ph{display:flex;align-items:center;gap:6px;padding:5px 9px;cursor:pointer;user-select:none;
  font-family:var(--cond);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);
  background:var(--bg3)}
.db-ph:hover{color:var(--tx)}
.db-ph .db-caret{font-size:9px;color:var(--tx3)}
.db-pb{padding:7px 9px}
.db-panel.db-collapsed .db-pb{display:none}
.db-pill{font-family:var(--mono);font-size:9px;padding:0 4px;border-radius:2px;background:var(--bg4);color:var(--tx2)}

/* roster slots */
.db-slot{display:flex;align-items:center;gap:6px;height:20px;border-bottom:1px solid #16242f}
.db-slot .db-sn{font-family:var(--cond);font-size:10px;letter-spacing:.08em;color:var(--tx3);width:32px;flex:0 0 32px}
.db-slot .db-sp{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.db-slot.db-empty .db-sp{color:#3f5568;font-style:italic}
.db-slot .db-sb{font-family:var(--mono);font-size:9px;color:var(--tx3);flex:0 0 auto}
.db-bench{border-top:1px solid var(--line)}
.db-warn{font-size:10px;color:var(--urgent);padding:2px 0;line-height:1.35}
.db-nxt{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;padding:1px 0;color:var(--tx2)}
.db-nxt b{color:var(--tx);font-weight:600}
.db-kb{display:flex;justify-content:space-between;font-size:10px;padding:1px 0;color:var(--tx2)}
.db-kb kbd{font-family:var(--mono);background:var(--bg4);border:1px solid var(--line);border-radius:2px;
  padding:0 4px;font-size:9px;color:var(--tx)}

/* rail widgets */
.db-mrow{display:flex;justify-content:space-between;align-items:baseline;padding:1px 0;font-size:11px}
.db-mrow .db-mv{font-family:var(--mono);font-size:11px}
.db-meter{height:4px;background:var(--ink);border-radius:2px;overflow:hidden;margin:3px 0 5px}
.db-meter i{display:block;height:100%;border-radius:2px}
.db-verdict{font-family:var(--cond);font-size:12px;letter-spacing:.03em;text-transform:uppercase;padding:2px 0}
.db-note{font-size:10px;color:var(--tx2);line-height:1.4}
.db-log{font-family:var(--mono);font-size:10px;display:flex;gap:5px;padding:1px 0;cursor:pointer;align-items:baseline}
.db-log:hover{background:var(--bg3)}
.db-log .db-lp{color:var(--tx3);flex:0 0 34px}
.db-log .db-ln{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--sans);font-size:11px}

/* ---------- tabs ---------- */
#db-tabs{display:flex;align-items:center;gap:2px;padding:5px 9px;border-bottom:1px solid var(--line);background:var(--bg2)}
.db-tab{font-family:var(--cond);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;border:1px solid transparent;color:var(--tx2);padding:3px 9px}
.db-tab:hover{color:var(--tx);background:var(--bg3)}
.db-tab.db-on{background:var(--bg4);border-color:var(--line2);color:var(--tx)}
.db-tab .db-tn{font-family:var(--mono);font-size:9px;color:var(--tx3);margin-right:4px}

#db-sub{display:flex;gap:2px;padding:4px 9px;border-bottom:1px solid var(--line);background:var(--bg2)}
#db-sub.db-hide{display:none}
.db-sb2{font-family:var(--cond);font-size:11px;letter-spacing:.08em;padding:2px 8px}

#db-viewport{flex:1 1 auto;overflow:auto;min-height:0;position:relative}

/* ---------- tables ---------- */
table.db-t{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:11px}
table.db-t thead th{position:sticky;top:0;z-index:20;background:var(--bg3);
  font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx2);border-bottom:1px solid var(--line2);border-right:1px solid var(--line);
  padding:0 5px;height:24px;user-select:none;cursor:pointer;overflow:hidden;white-space:nowrap;position:sticky}
table.db-t thead th:hover{color:var(--tx);background:var(--bg4)}
table.db-t tbody td{border-bottom:1px solid #14212b;border-right:1px solid #14212b;
  padding:0 5px;height:var(--rowh);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* alignment scoped to BOTH header and body */
table.db-t th.db-a-c,table.db-t td.db-a-c{text-align:center}
table.db-t th.db-a-l,table.db-t td.db-a-l{text-align:left}
table.db-t td.db-num,table.db-t th.db-num{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.db-t tbody tr:hover td{background:var(--bg3)}
table.db-t tbody tr.db-taken td{opacity:.38}
table.db-t tbody tr.db-mine td{background:rgba(58,214,192,.07)}
table.db-t tbody tr.db-strike td{background:rgba(255,138,91,.16)}
table.db-t tbody tr.db-strike td .db-pn{text-decoration:line-through}
table.db-t tbody tr{cursor:pointer}
table.db-t th.db-sorted{color:var(--accent)}
table.db-t th .db-sarrow{font-size:8px;margin-left:3px}
/* pinned columns — sticky on header AND body */
table.db-t th.db-pin{position:sticky;z-index:30;background:var(--bg4)}
table.db-t td.db-pin{position:sticky;z-index:10;background:var(--bg2)}
table.db-t tbody tr:hover td.db-pin{background:var(--bg3)}
/* resize handle on EVERY header cell */
th .db-rz{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;z-index:5}
th .db-rz::after{content:"";position:absolute;top:4px;right:3px;width:1px;height:calc(100% - 8px);background:var(--line2)}
th .db-rz:hover::after{background:var(--accent);width:2px}
th{position:relative}
.db-pos{font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.06em}
.db-tierbadge{font-family:var(--mono);font-size:9px;padding:0 3px;border-radius:2px;background:var(--bg4)}
.db-thin{color:var(--urgent);font-weight:600}
.db-empty{padding:26px;text-align:center;color:var(--tx3);font-family:var(--cond);letter-spacing:.1em;text-transform:uppercase}

/* ---------- draft board grid ---------- */
table.db-board{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:10px}
table.db-board th{position:sticky;top:0;z-index:20;background:var(--bg3);font-family:var(--cond);
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);height:26px;
  padding:0 3px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line);
  overflow:hidden;white-space:nowrap}
table.db-board th.db-rh{left:0;z-index:31;width:44px;background:var(--bg4)}
table.db-board td.db-rh{position:sticky;left:0;z-index:11;background:var(--bg3);font-family:var(--mono);
  font-size:10px;color:var(--tx2);text-align:center;border-right:1px solid var(--line2)}
table.db-board td{border-bottom:1px solid #14212b;border-right:1px solid #14212b;height:34px;
  padding:2px 4px;overflow:hidden;vertical-align:top;cursor:pointer}
table.db-board td:hover{background:var(--bg3)}
table.db-board td.db-me{background:rgba(58,214,192,.08)}
table.db-board td.db-onclock{box-shadow:inset 0 0 0 1px var(--accent)}
table.db-board td.db-skipped{background:repeating-linear-gradient(45deg,transparent,transparent 4px,rgba(255,138,91,.12) 4px,rgba(255,138,91,.12) 8px)}
.db-bp{font-family:var(--mono);font-size:8px;color:var(--tx3);line-height:1.1}
.db-bn{font-size:10px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db-bt{font-family:var(--cond);font-size:8px;letter-spacing:.06em;line-height:1.1}
.db-snake{font-size:9px;color:var(--tx3)}

/* ---------- menus ---------- */
.db-menu{position:fixed;z-index:200;background:var(--bg3);border:1px solid var(--line2);border-radius:4px;
  box-shadow:0 10px 34px rgba(0,0,0,.6);padding:5px;min-width:190px;max-height:74vh;overflow-y:auto;display:none}
.db-menu.db-open{display:block}
.db-mtitle{font-family:var(--cond);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--tx3);padding:3px 6px 5px}
.db-mi{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:3px;cursor:pointer;font-size:11px}
.db-mi:hover{background:var(--bg4)}
.db-mi .db-cb{font-family:var(--mono);font-size:11px;width:12px;flex:0 0 12px;color:var(--accent)}
.db-mi .db-mlabel{flex:1 1 auto}
.db-mi .db-pinb{font-family:var(--cond);font-size:9px;letter-spacing:.08em;padding:0 5px;border-radius:2px;
  border:1px solid var(--line);color:var(--tx3);background:transparent}
.db-mi .db-pinb.db-on{background:var(--accent2);border-color:var(--accent);color:#eafffb}
.db-mdiv{height:1px;background:var(--line);margin:4px 2px}

/* ---------- banner / toast ---------- */
#db-banner{display:none;align-items:center;gap:10px;padding:5px 10px;background:var(--urgent);color:#20130c;
  font-family:var(--cond);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
#db-banner.db-show{display:flex}
#db-banner button{background:rgba(0,0,0,.24);border-color:rgba(0,0,0,.3);color:#20130c}
#db-toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:300;background:var(--bg4);
  border:1px solid var(--line2);border-radius:4px;padding:6px 13px;font-size:12px;display:none;
  box-shadow:0 8px 26px rgba(0,0,0,.5)}
#db-toast.db-show{display:block}
#db-key{display:none;padding:7px 9px;background:var(--bg3);border-bottom:1px solid var(--line);
  font-size:11px;line-height:1.5;color:var(--tx2)}
#db-key.db-show{display:block}
#db-key b{color:var(--tx);font-family:var(--cond);letter-spacing:.06em;text-transform:uppercase}
.db-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:2px 16px}
</style>
</head>
<body>
<div id="db-app">
  <div id="db-top">
    <div class="db-bar">
      <div>
        <div class="db-pk" id="db-pknum">1.01</div>
        <div class="db-prog" id="db-pkprog">pick 1 / 180</div>
      </div>
      <div class="db-sep"></div>
      <div style="min-width:118px">
        <div class="db-lab">on the clock</div>
        <div class="db-clock" id="db-onclock">—</div>
      </div>
      <button id="db-skip" title="Skip this pick (leaves the slot in place)">Skip pick</button>
      <div class="db-sep"></div>
      <div style="min-width:96px">
        <div class="db-lab">your next pick</div>
        <div class="db-clock" id="db-mynext" style="font-family:var(--mono);font-size:13px">—</div>
      </div>
      <div class="db-sep"></div>
      <div class="db-searchwrap">
        <input id="db-search" type="text" autocomplete="off" spellcheck="false" placeholder="/  search player…">
        <div id="db-sugg"></div>
      </div>
      <div class="db-grow"></div>
      <div class="db-save" id="db-saveind">saved</div>
      <button id="db-undo" title="Nothing to undo">↶ Undo</button>
      <button id="db-data">Data ▾</button>
      <button id="db-more">⋯</button>
      <div class="db-sep"></div>
      <button id="db-tgl-l" title="Toggle left panel  [">◧</button>
      <button id="db-tgl-r" title="Toggle right panel  ]">◨</button>
    </div>
    <div id="db-banner"></div>
  </div>

  <div id="db-main">
    <div id="db-left"></div>
    <div id="db-center">
      <div id="db-tabs"></div>
      <div id="db-sub" class="db-hide"></div>
      <div id="db-key"></div>
      <div id="db-viewport"></div>
    </div>
    <div id="db-right"></div>
  </div>
</div>
<div id="db-toast"></div>
<div class="db-menu" id="db-menu-cols"></div>
<div class="db-menu" id="db-menu-ctx"></div>
<div class="db-menu" id="db-menu-data"></div>
<div class="db-menu" id="db-menu-more"></div>

<script src="draft-config-2026.js"></script>
<script>
/* Live Draft Board — application script.
   Depends on window.DRAFT_CONFIG from draft-config-<year>.js */
(function () {
"use strict";

var CFG = window.DRAFT_CONFIG;
var POS = ["QB", "RB", "WR", "TE", "K", "DST"];
var PI = {}; POS.forEach(function (p, i) { PI[p] = i; });
var TEAMS = CFG.teams, ROUNDS = CFG.rounds, NPICKS = TEAMS * ROUNDS;
var P = CFG.players;
var NP = P.length;
var STORE = "draftboard-" + CFG.year;

/* ------------------------------------------------------------------ utils */
function el(id) { return document.getElementById(id); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function slotAccepts(slot, pos) {
  if (slot === "BN") return true;
  if (slot === "FLEX") return CFG.flexEligible.indexOf(pos) >= 0;
  var a = (CFG.slotAccepts && CFG.slotAccepts[slot]) || [slot];
  return a.indexOf(pos) >= 0;
}
function isFlexPos(pos) { return CFG.flexEligible.indexOf(pos) >= 0; }

/* ------------------------------------------------------------- static tiers
   Tiers are computed once over the full ranking per position (a player's tier
   never changes mid-draft); what changes is how many of that tier remain. */
var TIER = new Int16Array(NP);          // tier number per player index
var TIER_MEMBERS = {};                  // pos -> [[idx,...], ...]
(function buildTiers() {
  POS.forEach(function (pos) {
    var idxs = [];
    for (var i = 0; i < NP; i++) if (P[i].pos === pos) idxs.push(i);
    idxs.sort(function (a, b) { return P[b].v - P[a].v; });
    var groups = [], cur = [], prev = null;
    for (var j = 0; j < idxs.length; j++) {
      var v = P[idxs[j]].v;
      if (prev !== null) {
        var drop = prev - v;
        if (drop / prev > CFG.tiers.dropPct && drop > CFG.tiers.absFloor) {
          groups.push(cur); cur = [];
        }
      }
      cur.push(idxs[j]); prev = v;
    }
    if (cur.length) groups.push(cur);
    /* A perfectly smooth value curve can leave one cluster running very long
       (e.g. 60+ late RBs whose gaps never clear the threshold). Split any
       over-long tier at its single largest internal drop, recursively, so no
       tier exceeds maxSize and the break always lands on the real gap. */
    var maxSize = CFG.tiers.maxSize || 99;
    var out = [];
    groups.forEach(function (g) {
      var stack = [g];
      while (stack.length) {
        var cg = stack.shift();
        if (cg.length <= maxSize) { out.push(cg); continue; }
        var bestAt = 1, bestDrop = -1;
        for (var s = 1; s < cg.length; s++) {
          var a = P[cg[s - 1]].v, b = P[cg[s]].v, rel = a > 0 ? (a - b) / a : 0;
          if (rel > bestDrop) { bestDrop = rel; bestAt = s; }
        }
        stack.unshift(cg.slice(0, bestAt), cg.slice(bestAt));
      }
    });
    out.forEach(function (g, gi) { g.forEach(function (ix) { TIER[ix] = gi + 1; }); });
    TIER_MEMBERS[pos] = out;
  });
})();

/* ------------------------------------------------------------------- state */
var S = null;
function freshState() {
  return {
    results: new Array(NPICKS).fill(null), // null | {pid} | {skip:true} | {unlisted,pos}
    owner: {},                             // pickIndex -> managerId (trade override)
    ui: {
      view: "best",
      subPos: "RB",
      hideTaken: true,
      left: true, right: true,
      keyOpen: false,
      rosterMgr: CFG.myManagerId,
      collapsed: {},
      cols: {},        // view -> {vis:[], pin:[], w:{}, sort:{k,dir}}
      editing: null    // pick index being edited
    }
  };
}
var undoStack = [];
function snapshot(label) {
  undoStack.push({
    label: label,
    results: S.results.slice(),
    owner: JSON.parse(JSON.stringify(S.owner))
  });
  if (undoStack.length > 120) undoStack.shift();
}

/* --------------------------------------------------------- pick scheduling */
function baseOwner(i) {
  var round = Math.floor(i / TEAMS), idx = i % TEAMS;
  var slot = (round % 2 === 0) ? idx : (TEAMS - 1 - idx);
  return CFG.managers[slot].id;
}

      if (M.edge[pid] === undefined) return "";
      var e = M.edge[pid];
      return '<span style="color:' + (e > 0.01 ? "var(--accent)" : "var(--tx3)") + '">' + fmt(e, 1) + "</span>";
    case "value": return fmt(p.v, 1);
    case "espn": return p.d ? "$" + p.d : '<span style="color:var(--tx3)">—</span>';
    case "bye": return String(p.b);
  }
  return "";
}

/* ------------------------------------------------------------ table builder */
var strikePid = null;
function buildTable(view, rows) {
  var oc = orderedCols(view), cols = oc.all, cst = colState(view);
  var table = document.createElement("table");
  table.className = "db-t";
  var total = 0; cols.forEach(function (k) { total += colWidth(view, k); });
  table.style.width = total + "px";

  var cg = "<colgroup>";
  cols.forEach(function (k) { cg += '<col data-k="' + k + '" style="width:' + colWidth(view, k) + 'px">'; });
  cg += "</colgroup>";

  var left = 0, offs = {};
  oc.pinned.forEach(function (k) { offs[k] = left; left += colWidth(view, k); });

  var th = "<thead><tr>";
  cols.forEach(function (k) {
    var d = COLDEF[k], cls = "db-a-" + d.align + (d.num ? " db-num" : "");
    if (oc.pinned.indexOf(k) >= 0) cls += " db-pin";
    if (cst.sort.k === k) cls += " db-sorted";
    var st = oc.pinned.indexOf(k) >= 0 ? ' style="left:' + offs[k] + 'px"' : "";
    var arrow = cst.sort.k === k ? '<span class="db-sarrow">' + (cst.sort.dir > 0 ? "▲" : "▼") + "</span>" : "";
    th += '<th class="' + cls + '" data-k="' + k + '"' + st + '>' + esc(d.label) + arrow +
          '<span class="db-rz" data-k="' + k + '"></span></th>';
  });
  th += "</tr></thead>";

  var tb = "<tbody>";
  rows.forEach(function (row) {
    if (row.kind === "tierhead") {
      tb += '<tr class="db-tierrow"><td colspan="' + cols.length + '" class="db-a-l" ' +
            'style="background:var(--bg3);font-family:var(--cond);font-size:10px;letter-spacing:.12em;' +
            'text-transform:uppercase;color:' + posColor(row.pos) + '">' + esc(row.label) + "</td></tr>";
      return;
    }
    var pid = row.pid, taken = M.taken[pid] >= 0;
    var cls = [];
    if (taken) cls.push("db-taken");
    if (taken && ownerOf(M.taken[pid]) === CFG.myManagerId) cls.push("db-mine");
    if (pid === strikePid) cls.push("db-strike");
    tb += '<tr class="' + cls.join(" ") + '" data-pid="' + pid + '">';
    cols.forEach(function (k) {
      var d = COLDEF[k], c2 = "db-a-" + d.align + (d.num ? " db-num" : "");
      if (oc.pinned.indexOf(k) >= 0) c2 += " db-pin";
      var st = oc.pinned.indexOf(k) >= 0 ? ' style="left:' + offs[k] + 'px"' : "";
      /* every cell keeps its box even when empty, so rows stay identical */
      tb += '<td class="' + c2 + '"' + st + ">" + cellHTML(k, pid) + "</td>";
    });
    tb += "</tr>";
  });
  tb += "</tbody>";

  table.innerHTML = cg + th + tb;
  return table;
}
function sortRows(view, pids) {
  var c = colState(view), k = c.sort.k, dir = c.sort.dir;
  return pids.slice().sort(function (a, b) {
    var va = cellVal(k, a), vb = cellVal(k, b);
    if (va < vb) return -dir; if (va > vb) return dir;
    return P[a].r - P[b].r;
  });
}
function visiblePids() {
  var out = [];
  for (var i = 0; i < NP; i++) {
    if (S.ui.hideTaken && M.taken[i] >= 0 && i !== strikePid) continue;
    out.push(i);
  }
  return out;
}

/* ------------------------------------------------------------- panel shell */
function panel(id, title, badge, body) {

    '<div class="db-ph"><span class="db-caret">' + (col ? "▶" : "▼") + "</span><span>" + esc(title) + "</span>" +
    (badge ? '<span class="db-grow"></span><span class="db-pill">' + badge + "</span>" : "") +
    '</div><div class="db-pb">' + body + "</div></div>";
}

/* ---------------------------------------------------------------- left rail */
function paintLeft() {
  var mid = S.ui.rosterMgr, R = rosterFor(mid);
  var opts = CFG.managers.map(function (m) {
    return '<option value="' + m.id + '"' + (m.id === mid ? " selected" : "") + ">" +

  }).join("");
  var body = '<select id="db-rostersel" style="width:100%;margin-bottom:6px">' + opts + "</select>";

    body += '<div class="db-slot' + (p ? "" : " db-empty") + '"><span class="db-sn" style="color:' +
      (p ? posColor(p.pos) : "var(--tx3)") + '">' + s.slot + '</span><span class="db-sp">' +

  var filled = R.slots.filter(function (s) { return s.pid !== null; }).length;

  });
  var warn = "";
  Object.keys(byes).sort(function (a, b) { return a - b; }).forEach(function (w) {
    if (byes[w].length < 2) return;
    warn += '<div class="db-warn">Week ' + w + ": " + byes[w].length + " starters out — " +
      byes[w].map(function (p) { return esc(p.n.split(" ").slice(-1)[0]); }).join(", ") + "</div>";
  });
  if (!warn) warn = '<div class="db-note">No multi-starter bye collisions.</div>';

    gaps += '<div class="db-nxt"><b>' + pickLabel(i) + "</b><span>" +
      (n === 0 ? (i === cur ? "on the clock" : "in " + (i - cur)) : "+" + (i - rem[n - 1]) + " wait") + "</span></div>";
  });
  if (!rem.length) gaps = '<div class="db-note">No picks remaining.</div>';

  var kb = [["/", "search"], ["1 – 4", "switch view"], ["[ ]", "toggle panels"], ["Ctrl+Z", "undo"],
            ["Enter", "take top match"], ["Esc", "cancel"]].map(function (r) {
    return '<div class="db-kb"><kbd>' + r[0] + "</kbd><span>" + r[1] + "</span></div>";
  }).join("");

  el("db-left").innerHTML =
    panel("roster", "Roster", filled + "/" + CFG.rosterTemplate.length, body) +
    panel("byes", "Bye conflicts", "", warn) +
    panel("gaps", "Remaining picks", String(rem.length), gaps) +
    panel("keys", "Shortcuts", "", kb);
  var sel = el("db-rostersel");
  if (sel) sel.onchange = function () { S.ui.rosterMgr = +this.value; save(); render(); };
}

function paintRight() {

  var rw = "";

      '<span class="db-mv">' + fmt(M.expRepl[p], 1) + "</span></div>";
  });
  er += '<div class="db-note">Average value of the best player left at each position when you are back on the clock' +
    (M.target < NPICKS ? " (" + pickLabel(M.target) + ")" : "") + ".</div>";

  var ts = "";
  POS.forEach(function (p) {
    var groups = TIER_MEMBERS[p], shown = 0;
    for (var g = 0; g < groups.length && shown < 2; g++) {

function paintCenter() {

    var cst = colState("pos");

      TIER_MEMBERS[S.ui.subPos].forEach(function (g, gi) {
        var mem = g.filter(function (ix) { return pool.indexOf(ix) >= 0; });
        if (!mem.length) return;
        rows.push({ kind: "tierhead", pos: S.ui.subPos, label: S.ui.subPos + " tier " + (gi + 1) + " — " + M.tierLeft[S.ui.subPos][gi] + " left" });
        sortRows("pos", mem).forEach(function (ix) { rows.push({ pid: ix }); });
      });
    } else {
      sortRows("pos", pool).forEach(function (ix) { rows.push({ pid: ix }); });
    }
  } else {
    var view = S.ui.view;
    var pool2 = visiblePids();

/* ---------------------------------------------------------- draft board grid */
function buildBoard() {
  var t = document.createElement("table");
  t.className = "db-board";
  var W = 128;
  t.style.width = (44 + TEAMS * W) + "px";
  var cg = '<colgroup><col style="width:44px">';
  for (var c = 0; c < TEAMS; c++) cg += '<col style="width:' + W + 'px">';
  cg += "</colgroup>";
  var th = '<thead><tr><th class="db-rh">RD</th>';
  CFG.managers.forEach(function (m) {
    th += "<th" + (m.id === CFG.myManagerId ? ' style="color:var(--accent)"' : "") + ">" +
      m.slot + ". " + esc(m.name) + "</th>";
  });
  th += "</tr></thead>";
  var tb = "<tbody>";
  for (var r = 0; r < ROUNDS; r++) {
    var rev = r % 2 === 1;
    tb += '<tr><td class="db-rh">' + (r + 1) + '<div class="db-snake">' + (rev ? "◀" : "▶") + "</div></td>";
    for (var slot = 0; slot < TEAMS; slot++) {
      /* find the pick index in this round owned at this column */
      var idxInRound = rev ? (TEAMS - 1 - slot) : slot;
      var i = r * TEAMS + idxInRound;
      var owner = ownerOf(i), res = S.results[i];
      var cls = [];
      if (owner === CFG.myManagerId) cls.push("db-me");
      if (i === M.cur) cls.push("db-onclock");
      if (res && res.skip) cls.push("db-skipped");
      var inner = '<div class="db-bp">' + pickLabel(i) +
        (owner !== baseOwner(i) ? " ⇄ " + esc(mgrName(owner)) : "") + "</div>";
      if (res && res.pid !== undefined) {
        inner += '<div class="db-bn">' + esc(P[res.pid].n) + "</div>" +
          '<div class="db-bt" style="color:' + posColor(P[res.pid].pos) + '">' + P[res.pid].pos + " · " + P[res.pid].t + "</div>";
      } else if (res && res.skip) {
        inner += '<div class="db-bn" style="color:var(--urgent)">skipped</div><div class="db-bt"></div>';
      } else if (res && res.unlisted) {
        inner += '<div class="db-bn">' + esc(res.unlisted) + '</div><div class="db-bt">unlisted</div>';
      } else {
        inner += '<div class="db-bn"></div><div class="db-bt"></div>';
      }
      tb += '<td class="' + cls.join(" ") + '" data-pick="' + i + '">' + inner + "</td>";
    }
    tb += "</tr>";
  }
  tb += "</tbody>";
  t.innerHTML = cg + th + tb;
  return t;
}

/* ------------------------------------------------------------------- menus */
var openMenu = null;
function closeMenus() {
  ["db-menu-cols", "db-menu-ctx", "db-menu-data", "db-menu-more"].forEach(function (id) {
    var m = el(id); if (m) m.classList.remove("db-open");

}
function showMenu(id, anchor, html) {

/* Column picker. Re-renders its own list on every edit, so the click handler is
   bound to the STABLE menu container and stays attached across edits. */
function colMenuHTML(view) {
  var c = colState(view);
  var h = '<div class="db-mtitle">Columns — ' + esc(VIEWLABEL[view]) + "</div>";
  COLORDER.forEach(function (k) {
    var on = c.vis.indexOf(k) >= 0, pin = c.pin.indexOf(k) >= 0;
    h += '<div class="db-mi" data-col="' + k + '">' +
      '<span class="db-cb">' + (on ? "✓" : "") + "</span>" +
      '<span class="db-mlabel">' + esc(COLDEF[k].label) + "</span>" +
      '<button class="db-pinb' + (pin ? " db-on" : "") + '" data-pin="' + k + '">pin</button></div>';
  });
  h += '<div class="db-mdiv"></div><div class="db-mi" data-colreset="1"><span class="db-cb"></span>' +
    '<span class="db-mlabel">Reset columns &amp; widths</span></div>';
  return h;
}
function openColMenu(anchor) {
  var view = S.ui.view;
  var m = showMenu("db-menu-cols", anchor, colMenuHTML(view));
  m.onclick = function (e) {
    var pinb = e.target.closest("[data-pin]");
    if (pinb) {
      var k = pinb.getAttribute("data-pin"), c = colState(view);
      var ix = c.pin.indexOf(k);
      if (ix >= 0) c.pin.splice(ix, 1); else c.pin.push(k);
      if (c.vis.indexOf(k) < 0) c.vis.push(k);
      save(); m.innerHTML = colMenuHTML(view); paintCenter(); return;
    }
    if (e.target.closest("[data-colreset]")) {
      var d = DEFAULTS[view] || DEFAULTS.top300;
      S.ui.cols[view] = { vis: d.vis.slice(), pin: d.pin.slice(), w: {}, sort: { k: d.sort.k, dir: d.sort.dir } };
      save(); m.innerHTML = colMenuHTML(view); paintCenter(); return;
    }
    var row = e.target.closest("[data-col]");
    if (row) {
      var k2 = row.getAttribute("data-col"), c2 = colState(view);
      var i2 = c2.vis.indexOf(k2);
      if (i2 >= 0) {
        if (c2.vis.length <= 1) { toast("Keep at least one column"); return; }
        c2.vis.splice(i2, 1);
        var pi2 = c2.pin.indexOf(k2); if (pi2 >= 0) c2.pin.splice(pi2, 1);
      } else c2.vis.push(k2);
      save(); m.innerHTML = colMenuHTML(view); paintCenter();
    }
  };
}
function openPickMenu(pickIndex, anchor) {
  var res = S.results[pickIndex];
  var h = '<div class="db-mtitle">Pick ' + pickLabel(pickIndex) + " — " + esc(mgrName(ownerOf(pickIndex))) + "</div>";
  h += '<div class="db-mi" data-act="edit"><span class="db-cb">✎</span><span class="db-mlabel">Change player</span></div>';
  h += '<div class="db-mi" data-act="skip"><span class="db-cb">⤼</span><span class="db-mlabel">Mark skipped</span></div>';
  if (res) h += '<div class="db-mi" data-act="clear"><span class="db-cb">✕</span><span class="db-mlabel">Clear this pick</span></div>';
  h += '<div class="db-mdiv"></div><div class="db-mtitle">Reassign owner (trade)</div>';
  CFG.managers.forEach(function (m2) {
    var isNow = ownerOf(pickIndex) === m2.id;
    h += '<div class="db-mi" data-owner="' + m2.id + '"><span class="db-cb">' + (isNow ? "●" : "") + "</span>" +
      '<span class="db-mlabel">' + m2.slot + ". " + esc(m2.name) + "</span></div>";
  });
  var m = showMenu("db-menu-ctx", anchor, h);
  m.onclick = function (e) {
    var own = e.target.closest("[data-owner]");
    if (own) {
      reassign(pickIndex, +own.getAttribute("data-owner"));
      closeMenus(); commit(); toast("Pick " + pickLabel(pickIndex) + " reassigned — schedules recomputed");
      return;
    }
    var a = e.target.closest("[data-act]");
    if (!a) return;
    var act = a.getAttribute("data-act");
    closeMenus();
    if (act === "edit") { S.ui.editing = pickIndex; render(); el("db-search").focus(); }
    else if (act === "skip") { skipPick(pickIndex); commit(); }
    else if (act === "clear") { clearPick(pickIndex); commit(); }
  };
}
function openDataMenu(anchor) {
  var h = '<div class="db-mtitle">Data</div>' +
    '<div class="db-mi" data-act="export"><span class="db-cb">↓</span><span class="db-mlabel">Export board as JSON</span></div>' +
    '<div class="db-mi" data-act="import"><span class="db-cb">↑</span><span class="db-mlabel">Import board JSON…</span></div>' +
    '<div class="db-mi" data-act="share"><span class="db-cb">⇢</span><span class="db-mlabel">Copy shareable link</span></div>' +
    '<div class="db-mdiv"></div>' +
    '<div class="db-mi" data-act="reset"><span class="db-cb">⟲</span><span class="db-mlabel">Reset entire board</span></div>';
  var m = showMenu("db-menu-data", anchor, h);
  m.onclick = function (e) {
    var a = e.target.closest("[data-act]"); if (!a) return;
    var act = a.getAttribute("data-act"); closeMenus();
    if (act === "export") {
      var blob = new Blob([JSON.stringify(serialize(), null, 1)], { type: "application/json" });
      var u = URL.createObjectURL(blob), link = document.createElement("a");
      link.href = u; link.download = "draft-" + CFG.year + ".json"; link.click();
      setTimeout(function () { URL.revokeObjectURL(u); }, 2000);
    } else if (act === "import") {
      var inp = document.createElement("input");
      inp.type = "file"; inp.accept = "application/json,.json";
      inp.onchange = function () {
        var f = inp.files[0]; if (!f) return;
        var fr = new FileReader();
        fr.onload = function () {
          try { S = deserialize(JSON.parse(fr.result)); undoStack.length = 0; commit(); toast("Board imported"); }
          catch (err) { toast("Could not read that file"); }
        };
        fr.readAsText(f);
      };
      inp.click();
    } else if (act === "share") {
      var link2 = shareLink();
      if (navigator.clipboard) navigator.clipboard.writeText(link2).then(function () { toast("Link copied"); },
        function () { prompt("Copy this link", link2); });
      else prompt("Copy this link", link2);
    } else if (act === "reset") {
      if (confirm("Reset the entire board? Every pick will be cleared.")) {
        snapshot("full board reset");
        var keepUI = S.ui; S = freshState(); S.ui = keepUI; S.ui.editing = null; commit();
      }
    }
  };
}
function openMoreMenu(anchor) {
  var h = '<div class="db-mtitle">More</div>' +
    '<div class="db-mi" data-act="unlisted"><span class="db-cb">+</span><span class="db-mlabel">Mark unlisted player…</span></div>' +
    '<div class="db-mi" data-act="hidetaken"><span class="db-cb">' + (S.ui.hideTaken ? "✓" : "") + '</span><span class="db-mlabel">Hide taken players</span></div>' +
    '<div class="db-mi" data-act="key"><span class="db-cb">' + (S.ui.keyOpen ? "✓" : "") + '</span><span class="db-mlabel">Show column key</span></div>' +
    '<div class="db-mdiv"></div>' +
    '<div class="db-mi" data-act="cols"><span class="db-cb">▦</span><span class="db-mlabel">Columns…</span></div>';
  var m = showMenu("db-menu-more", anchor, h);
  m.onclick = function (e) {
    var a = e.target.closest("[data-act]"); if (!a) return;
    var act = a.getAttribute("data-act");
    if (act === "unlisted") {
      closeMenus();
      var nm = prompt("Player name (not in the rankings):");
      if (nm) { var pz = (prompt("Position (QB/RB/WR/TE/K/DST):", "RB") || "?").toUpperCase(); markUnlisted(nm, pz); commit(); }
    } else if (act === "hidetaken") { S.ui.hideTaken = !S.ui.hideTaken; save(); m.innerHTML = ""; closeMenus(); render(); }
    else if (act === "key") { S.ui.keyOpen = !S.ui.keyOpen; save(); closeMenus(); render(); }
    else if (act === "cols") { closeMenus(); openColMenu(el("db-more")); }
  };
}

/* ------------------------------------------------------------------ search */
function fuzzy(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  var out = [];
  for (var i = 0; i < NP; i++) {
    if (S.ui.editing === null && M.taken[i] >= 0) continue;
    var n = P[i].n.toLowerCase(), score = -1;
    var ix = n.indexOf(q);
    if (ix === 0) score = 1000;
    else if (ix > 0) score = 700 - ix;
    else {
      /* subsequence match across the name */
      var qi = 0, gaps = 0, last = -1;
      for (var c = 0; c < n.length && qi < q.length; c++) {
        if (n[c] === q[qi]) { if (last >= 0) gaps += c - last - 1; last = c; qi++; }
      }
      if (qi === q.length) score = 400 - gaps;
    }
    if (score < 0) continue;
    out.push({ pid: i, score: score - P[i].r * 0.35 });
  }
  out.sort(function (a, b) { return b.score - a.score; });
  return out.slice(0, 12);
}
var suggSel = 0, suggList = [];
function paintSugg() {
  var box = el("db-sugg"), q = el("db-search").value;
  suggList = fuzzy(q);
  if (!q.trim()) { box.classList.remove("db-open"); box.innerHTML = ""; return; }
  var h = suggList.map(function (s, i) {
    var p = P[s.pid];
    return '<div class="db-sg' + (i === suggSel ? " db-sel" : "") + '" data-pid="' + s.pid + '">' +
      '<span class="db-pos" style="color:' + posColor(p.pos) + ';width:38px;flex:0 0 38px">' + p.pos + p.pr + "</span>" +
      '<span style="flex:1 1 auto;overflow:hidden;text-overflow:ellipsis">' + esc(p.n) + "</span>" +
      '<span style="font-family:var(--mono);font-size:10px;color:var(--tx3)">' + p.t + " · #" + p.r + "</span></div>";
  }).join("");
  h += '<div class="db-sg" data-unlisted="1" style="color:var(--urgent)">' +
    '<span class="db-cb" style="width:38px;flex:0 0 38px">+</span>' +
    '<span>Mark unlisted player “' + esc(q.trim()) + "”</span></div>";
  box.innerHTML = h;
  box.classList.add("db-open");
}
function takePid(pid) {
  var target = (S.ui.editing !== null && S.ui.editing !== undefined) ? S.ui.editing : undefined;
  if (!assignPlayer(pid, target)) return;
  S.ui.editing = null;
  el("db-search").value = "";
  el("db-sugg").classList.remove("db-open");
  strikePid = pid;
  commit();
  setTimeout(function () { strikePid = null; paintCenter(); }, 430);
}

/* ------------------------------------------------------------------ render */
var rafPending = false;
function render() {
  computeMetrics();
  paintTop(); paintLeft(); paintTabs(); paintSub(); paintCenter(); paintRight();
  document.body.classList.toggle("db-noleft", !S.ui.left);
  document.body.classList.toggle("db-noright", !S.ui.right);
}
function commit() { save(); render(); }
function scheduleRender() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(function () { rafPending = false; render(); });
}

/* ------------------------------------------------------------------ events */
function wire() {
  /* Dismiss menus on MOUSEDOWN, not click — a click handler on document fires
     on the very same click that opened the menu, closing it instantly. */
  document.addEventListener("mousedown", function (e) {
    if (!openMenu) return;
    var m = el(openMenu);
    if (m && m.contains(e.target)) return;
    if (e.target.closest && e.target.closest("#db-colbtn,#db-data,#db-more")) return;
    closeMenus();
  });

  el("db-tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-view]"); if (!b) return;
    S.ui.view = b.getAttribute("data-view"); save(); render();
  });
  el("db-sub").addEventListener("click", function (e) {
    var p = e.target.closest("[data-pos]");
    if (p) { S.ui.subPos = p.getAttribute("data-pos"); save(); render(); return; }
    if (e.target.closest("#db-hidetaken")) { S.ui.hideTaken = !S.ui.hideTaken; save(); render(); return; }
    if (e.target.closest("#db-colbtn")) { openColMenu(el("db-colbtn")); return; }
    if (e.target.closest("#db-keybtn")) { S.ui.keyOpen = !S.ui.keyOpen; save(); render(); return; }
  });

  /* panel collapse (delegated so it survives re-render) */
  ["db-left", "db-right"].forEach(function (id) {
    el(id).addEventListener("click", function (e) {
      var lg = e.target.closest(".db-log");
      if (lg) { openPickMenu(+lg.getAttribute("data-pick"), lg); return; }
      var h = e.target.closest(".db-ph"); if (!h) return;
      var pan = h.parentNode.getAttribute("data-panel");
      S.ui.collapsed[pan] = !S.ui.collapsed[pan];
      save(); render();
    });
  });

  var vp = el("db-viewport");
  vp.addEventListener("click", function (e) {
    if (e.target.closest(".db-rz")) return;
    var th = e.target.closest("th[data-k]");
    if (th) {
      var k = th.getAttribute("data-k"), c = colState(S.ui.view);
      if (c.sort.k === k) c.sort.dir = -c.sort.dir;
      else { c.sort.k = k; c.sort.dir = (k === "player" || k === "team" || k === "rank" || k === "pos" || k === "bye" || k === "tier") ? 1 : -1; }
      save(); paintSub(); paintCenter(); return;
    }
    var cell = e.target.closest("td[data-pick]");
    if (cell) { openPickMenu(+cell.getAttribute("data-pick"), cell); return; }
    var tr = e.target.closest("tr[data-pid]");
    if (tr) {
      var pid = +tr.getAttribute("data-pid");
      if (M.taken[pid] >= 0 && S.ui.editing === null) { openPickMenu(M.taken[pid], tr); return; }
      takePid(pid);
    }
  });

  /* column resize — drag the right edge of ANY header cell */
  var rz = null;
  vp.addEventListener("mousedown", function (e) {
    var h = e.target.closest(".db-rz"); if (!h) return;
    e.preventDefault();
    rz = { k: h.getAttribute("data-k"), x: e.clientX, w: colWidth(S.ui.view, h.getAttribute("data-k")) };
  });
  window.addEventListener("mousemove", function (e) {
    if (!rz) return;
    var w = clamp(rz.w + (e.clientX - rz.x), 28, 460);
    colState(S.ui.view).w[rz.k] = w;
    var col = vp.querySelector('col[data-k="' + rz.k + '"]');
    if (col) col.style.width = w + "px";
  });
  window.addEventListener("mouseup", function () { if (rz) { rz = null; save(); paintCenter(); } });
  vp.addEventListener("dblclick", function (e) {
    var h = e.target.closest(".db-rz"); if (!h) return;
    delete colState(S.ui.view).w[h.getAttribute("data-k")];
    save(); paintCenter();
  });

  el("db-skip").onclick = function () { if (skipPick()) commit(); };
  el("db-undo").onclick = function () { undo(); commit(); };
  el("db-data").onclick = function () { openDataMenu(el("db-data")); };
  el("db-more").onclick = function () { openMoreMenu(el("db-more")); };
  el("db-tgl-l").onclick = function () { S.ui.left = !S.ui.left; save(); render(); };
  el("db-tgl-r").onclick = function () { S.ui.right = !S.ui.right; save(); render(); };

  var sb = el("db-search");
  sb.addEventListener("input", function () { suggSel = 0; paintSugg(); });
  sb.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { suggSel = Math.min(suggSel + 1, suggList.length); paintSugg(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { suggSel = Math.max(suggSel - 1, 0); paintSugg(); e.preventDefault(); }
    else if (e.key === "Enter") {
      if (suggSel < suggList.length && suggList.length) takePid(suggList[suggSel].pid);
      else if (sb.value.trim()) {
        var pz = (prompt("Position for “" + sb.value.trim() + "” (QB/RB/WR/TE/K/DST):", "RB") || "?").toUpperCase();
        markUnlisted(sb.value.trim(), pz, S.ui.editing === null ? undefined : S.ui.editing);
        S.ui.editing = null; sb.value = ""; el("db-sugg").classList.remove("db-open"); commit();
      }
      e.preventDefault();
    } else if (e.key === "Escape") {
      sb.value = ""; el("db-sugg").classList.remove("db-open"); sb.blur();
      if (S.ui.editing !== null) { S.ui.editing = null; render(); }
    }
  });
  el("db-sugg").addEventListener("mousedown", function (e) {
    var u = e.target.closest("[data-unlisted]");
    if (u) {
      var q = sb.value.trim();
      var pz = (prompt("Position for “" + q + "” (QB/RB/WR/TE/K/DST):", "RB") || "?").toUpperCase();
      markUnlisted(q, pz, S.ui.editing === null ? undefined : S.ui.editing);
      S.ui.editing = null; sb.value = ""; el("db-sugg").classList.remove("db-open"); commit(); return;
    }
    var d = e.target.closest("[data-pid]");
    if (d) takePid(+d.getAttribute("data-pid"));
  });

  document.addEventListener("keydown", function (e) {
    var typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); commit(); return; }
    if (typing) return;
    if (e.key === "/") { e.preventDefault(); el("db-search").focus(); return; }
    if (e.key === "Escape") { closeMenus(); if (S.ui.editing !== null) { S.ui.editing = null; render(); } return; }
    if (e.key === "[") { S.ui.left = !S.ui.left; save(); render(); return; }
    if (e.key === "]") { S.ui.right = !S.ui.right; save(); render(); return; }
    if (["1", "2", "3", "4"].indexOf(e.key) >= 0) { S.ui.view = VIEWS[+e.key - 1]; save(); render(); }
  });
  window.addEventListener("resize", scheduleRender);
}

/* -------------------------------------------------------------------- boot */
var booted = false;
function boot() {
  if (booted) return;
  booted = true;
  load();
  wire();
  render();
}
if (typeof document !== "undefined" && document.getElementById) {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
}
window.DB.render = render;
window.DB.boot = boot;
window.DB.buildTable = buildTable;
window.DB.buildBoard = buildBoard;
window.DB.colState = colState;
window.DB.orderedCols = orderedCols;
window.DB.visiblePids = visiblePids;
window.DB.sortRows = sortRows;
window.DB.openColMenu = openColMenu;
window.DB.openPickMenu = openPickMenu;
window.DB.closeMenus = closeMenus;
window.DB.COLORDER = COLORDER;
window.DB.COLDEF = COLDEF;
window.DB.takePid = takePid;

})();

</script>
