<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 Draft Board · PPR Top 300</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#071418;
  --panel:#0c1e24;
  --panel-2:#102830;
  --line:#17343d;
  --line-soft:#122b33;
  --text:#dbeaed;
  --dim:#7fa0a8;
  --dimmer:#527078;
  --chalk:#f2f7f7;
  --accent:#ffc247;
  --danger:#ff6b5e;
  --qb:#f4a259;
  --rb:#5fd6a0;
  --wr:#6cb8ff;
  --te:#c48cff;
  --k:#93a7ad;
  --dst:#3fd0c2;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --cond:'Barlow Condensed',sans-serif;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1200px 600px at 50% -10%, #0e2932 0%, transparent 60%),
    var(--ink);
  color:var(--text);font-family:var(--sans);font-size:14px;
  -webkit-font-smoothing:antialiased;
}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,#0a1c22 0%, #0a1c22 72%, rgba(10,28,34,.92) 100%);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(6px);
}
.bar{
  max-width:1010px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{
  font-family:var(--cond);font-weight:700;font-size:22px;letter-spacing:.06em;
  text-transform:uppercase;margin:0;color:var(--chalk);
}
.brand .sub{font-family:var(--cond);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer)}

.search{position:relative;flex:1 1 260px;max-width:380px}
.search input{
  width:100%;padding:9px 34px 9px 32px;border-radius:2px;
  background:var(--panel-2);border:1px solid var(--line);
  color:var(--chalk);font-family:var(--sans);font-size:14px;
}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,194,71,.14)}
.search input::placeholder{color:var(--dimmer)}
.search .mag{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dimmer);font-size:13px}
.search .slash{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:11px;color:var(--dimmer);
  border:1px solid var(--line);border-radius:2px;padding:1px 5px;pointer-events:none;
}
.search input:focus + .mag + .slash,.search.filled .slash{display:none}

.tools{display:flex;gap:6px;align-items:center}
button.btn{
  font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:600;
  background:var(--panel-2);border:1px solid var(--line);color:var(--dim);
  padding:7px 11px;border-radius:2px;cursor:pointer;
}
button.btn:hover:not(:disabled){color:var(--chalk);border-color:#27515d}
button.btn:disabled{opacity:.4;cursor:not-allowed}
button.btn.warn:hover{color:var(--danger);border-color:#5a2b2a}
button.btn.on{color:var(--ink);background:var(--accent);border-color:var(--accent)}
button.btn:focus-visible,.tab:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- tabs ---------- */
.tabs{
  max-width:1010px;margin:0 auto;padding:0 16px 0;
  display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;
  padding:8px 12px 9px;display:flex;align-items:baseline;gap:7px;white-space:nowrap;
  font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:14px;font-weight:600;
  color:var(--dimmer);
}
.tab:hover{color:var(--text)}
.tab .ct{font-family:var(--mono);font-size:11px;letter-spacing:0;color:var(--dimmer)}
.tab[aria-selected="true"]{color:var(--chalk);border-bottom-color:var(--pc,var(--accent))}
.tab[aria-selected="true"] .ct{color:var(--pc,var(--accent))}

/* ---------- gauge ---------- */
.gauge{max-width:1010px;margin:0 auto;padding:9px 16px 11px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:7px}
.pill .dot{width:7px;height:7px;border-radius:50%}
.pill .lbl{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--dim)}
.pill .num{font-family:var(--mono);font-size:12px;color:var(--chalk)}
.pill .num i{font-style:normal;color:var(--dimmer)}
.gauge .drafted{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}
.gauge .drafted b{color:var(--accent);font-weight:600}

/* ---------- table ---------- */
main{max-width:1010px;margin:0 auto;padding:0 16px 90px}
.sheet{border:1px solid var(--line);border-top:0;background:var(--panel)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
col.c-rank{width:52px} col.c-pos{width:64px} col.c-team{width:64px}
col.c-val{width:60px} col.c-bye{width:52px}
thead th{
  position:sticky;top:0;z-index:20;
  background:var(--panel-2);border-bottom:1px solid var(--line);
  font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:600;
  color:var(--dimmer);padding:8px 8px;text-align:center;
}
thead th.name{text-align:left}
tbody td{
  border-bottom:1px solid var(--line-soft);padding:0 8px;height:31px;
  text-align:center;vertical-align:middle;font-family:var(--mono);font-size:13px;
}
tbody td.name{
  text-align:left;font-family:var(--sans);font-size:14px;color:var(--chalk);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;
}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#13303a}
tbody tr:hover td.name{color:#fff}
tbody tr.hit td{background:#173a45}
tbody tr.hit td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
td.rank{color:var(--dimmer);font-size:12px}
td.val{color:var(--dim)}
td.bye{color:var(--dim);font-size:12px}
td.team{color:var(--dim);font-size:12px;letter-spacing:.04em}
.tag{
  display:inline-block;min-width:46px;padding:1px 5px;border-radius:2px;
  font-family:var(--mono);font-size:11px;font-weight:500;
  background:color-mix(in srgb,var(--pc) 13%,transparent);
  color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 26%,transparent);
}

/* the cross-off: a pen stroke drawn across the name */
td.name .stroke{
  position:absolute;left:8px;right:8px;top:50%;height:2px;background:var(--danger);
  transform:scaleX(0);transform-origin:left center;border-radius:2px;
  opacity:.95;pointer-events:none;
}
tr.striking td.name .stroke{animation:strike .26s cubic-bezier(.5,0,.2,1) forwards}
@keyframes strike{to{transform:scaleX(1)}}
tr.striking td{background:#2a1a1c!important}

tr.taken td{color:var(--dimmer)}
tr.taken td.name{color:var(--dimmer);text-decoration:line-through;text-decoration-color:#6b3a38;text-decoration-thickness:2px}
tr.taken .tag{opacity:.4}
tr.taken:hover td.name{color:var(--dim)}

.empty{padding:44px 16px;text-align:center;color:var(--dim)}
.empty b{display:block;font-family:var(--cond);font-size:19px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text);margin-bottom:6px}
.empty button{margin-top:14px}

/* ---------- footer status ---------- */
.status{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(8,24,29,.94);border-top:1px solid var(--line);
  backdrop-filter:blur(6px);
}
.status .inner{
  max-width:1010px;margin:0 auto;padding:8px 16px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  font-family:var(--mono);font-size:12px;color:var(--dimmer);
}
.status kbd{
  font-family:var(--mono);font-size:11px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:2px;padding:1px 5px;color:var(--dim);
}
.status .last{margin-left:auto;color:var(--dim)}
.status .last b{color:var(--text);font-weight:500}

@media (max-width:720px){
  .brand .sub{display:none}
  .bar{padding:8px 12px;gap:8px}
  .search{order:3;max-width:none;flex-basis:100%}
  main,.tabs,.gauge,.status .inner{padding-left:10px;padding-right:10px}
  tbody td{height:36px;padding:0 4px;font-size:12px}
  tbody td.name{font-size:14px}
  col.c-rank{width:36px} col.c-pos{width:46px} col.c-team{width:40px}
  col.c-val{width:42px} col.c-bye{width:28px}
  .tag{min-width:0;padding:1px 3px;font-size:10px}
  thead th{padding:8px 2px;font-size:10px;letter-spacing:.04em;overflow:hidden}
  .gauge{gap:12px;padding:8px 10px 10px}
  .status .inner .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>

    taken:[...taken], view, showTaken, history:history.slice(-60)
  })); }catch(e){}
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY)||'null');
    if(!s) return;
    taken = new Set(s.taken||[]);
    history = s.history||[];
    showTaken = !!s.showTaken;
    if(ORDER.includes(s.view)) view = s.view;
  }catch(e){}
}

/* ---------- search ---------- */
const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g,'');
PLAYERS.forEach(p => { p.key = norm(p.n); p.short = p.key.replace(/ /g,''); });

function score(p, q){
  if(!q) return 0;
  const posTag = (p.pos + p.pr).toLowerCase();
  if(p.key.startsWith(q)) return 0;
  const last = p.key.split(' ').slice(1).join(' ');
  if(last.startsWith(q)) return 1;
  if(p.key.includes(q)) return 2;
  if(p.t.toLowerCase() === q || posTag === q || p.pos.toLowerCase() === q) return 3;
  if(p.short.includes(q.replace(/ /g,''))) return 4;
  // subsequence, for typos and initials
  let i = 0;
  for(const ch of p.short){ if(ch === q[i]) i++; if(i === q.length) return 5; }
  return -1;
}

const POSWORD = {qb:'QB', rb:'RB', wr:'WR', te:'TE', k:'K', dst:'DST', dt:'DST', def:'DST', defense:'DST'};
const TEAMS = new Set(PLAYERS.map(p => p.t));

function visible(){
  const q = norm(query).trim();
  let list = PLAYERS.filter(p => view === 'ALL' || p.pos === view);
  if(!showTaken) list = list.filter(p => !taken.has(p.r));
  if(POSWORD[q])            return list.filter(p => p.pos === POSWORD[q]);
  if(TEAMS.has(q.toUpperCase())) return list.filter(p => p.t === q.toUpperCase());
  if(q){
    list = list.map(p => ({p, s:score(p,q)})).filter(x => x.s >= 0)
               .sort((a,b) => a.s - b.s || a.p.r - b.p.r).map(x => x.p);
  }
  return list;
}

/* ---------- actions ---------- */
function toggle(rank, rowEl){
  const p = PLAYERS.find(x => x.r === rank);
  const wasTaken = taken.has(rank);
  history.push({r:rank, taken:!wasTaken});
  if(wasTaken){ taken.delete(rank); save(); render(); flashLast('Back on the board: ' + p.n); return; }
  taken.add(rank); save();
  if(rowEl && !reducedMotion()){
    rowEl.classList.add('striking');
    setTimeout(() => { render(); }, 280);
  } else { render(); }
  flashLast('Crossed off: ' + p.n + ' · ' + p.pos + p.pr);
}
function undo(){
  const h = history.pop();
  if(!h) return;
  const p = PLAYERS.find(x => x.r === h.r);
  if(h.taken) taken.delete(h.r); else taken.add(h.r);
  save(); render();
  flashLast('Undid: ' + p.n);
}
function reset(){
  if(taken.size && !confirm('Put all ' + taken.size + ' drafted players back on the board?')) return;
  taken.clear(); history = []; save(); render(); flashLast('Board cleared');
}
function reducedMotion(){
  try{ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch(e){ return false; }
}
function flashLast(msg){ document.getElementById('last').innerHTML = '<b>' + msg + '</b>'; }

/* ---------- render ---------- */
const rowsEl = document.getElementById('rows');
const emptyEl = document.getElementById('empty');

function counts(){
  const c = {ALL:{left:0,total:PLAYERS.length}};
  for(const k in POS) c[k] = {left:0, total:0};
  for(const p of PLAYERS){
    c[p.pos].total++;
    if(!taken.has(p.r)){ c[p.pos].left++; c.ALL.left++; }
  }
  return c;
}

function renderTabs(c){
  const t = document.getElementById('tabs');
  t.innerHTML = '';
  ORDER.forEach(k => {
    const b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.role = 'tab';
    b.setAttribute('aria-selected', view === k);
    b.style.setProperty('--pc', k === 'ALL' ? 'var(--accent)' : POS[k].c);
    b.innerHTML = '<span>' + (k === 'DST' ? 'D/ST' : k) + '</span><span class="ct">' + c[k].left + '</span>';
    b.onclick = () => { view = k; save(); render(); };
    t.appendChild(b);
  });
}

function renderGauge(c){
  const g = document.getElementById('gauge');
  g.innerHTML = '';
  for(const k in POS){
    const d = document.createElement('div');
    d.className = 'pill';
    d.innerHTML = '<span class="dot" style="background:' + POS[k].c + '"></span>' +
      '<span class="lbl">' + (k === 'DST' ? 'D/ST' : k) + '</span>' +
      '<span class="num">' + c[k].left + '<i>/' + c[k].total + '</i></span>';
    g.appendChild(d);
  }
  const s = document.createElement('div');
  s.className = 'drafted';
  s.innerHTML = '<b>' + taken.size + '</b> drafted · <b>' + c.ALL.left + '</b> available';
  g.appendChild(s);
}

function render(){
  const c = counts();
  renderTabs(c); renderGauge(c);

  const list = visible();
  rowsEl.innerHTML = '';
  const frag = document.createDocumentFragment();
  const q = norm(query).trim();

  list.forEach((p, i) => {
    const tr = document.createElement('tr');
    tr.dataset.rank = p.r;
    tr.tabIndex = 0;
    if(taken.has(p.r)) tr.classList.add('taken');
    if(q && i === 0) tr.classList.add('hit');
    tr.style.setProperty('--pc', POS[p.pos].c);
    tr.innerHTML =
      '<td class="rank">' + p.r + '</td>' +
      '<td><span class="tag">' + (p.pos === 'DST' ? 'DST' : p.pos) + p.pr + '</span></td>' +
      '<td class="name">' + esc(p.n) + '<span class="stroke"></span></td>' +
      '<td class="team">' + p.t + '</td>' +
      '<td class="val">$' + p.v + '</td>' +
      '<td class="bye">' + p.b + '</td>';
    frag.appendChild(tr);
  });
  rowsEl.appendChild(frag);

  if(!list.length){
    emptyEl.hidden = false;
    emptyEl.innerHTML = query
      ? '<b>No match for “' + esc(query) + '”</b>Try a last name, an NFL team like DET, or a position like WR.'
      : (showTaken ? '<b>Nothing here yet</b>No players in this view.'
                   : '<b>All drafted</b>Every player in this view is off the board.');
  } else emptyEl.hidden = true;

  document.getElementById('undo').disabled = !history.length;
  const st = document.getElementById('showTaken');
  st.classList.toggle('on', showTaken);
  st.setAttribute('aria-pressed', showTaken);
  st.textContent = showTaken ? 'Hide taken' : 'Show taken';
  document.getElementById('searchWrap').classList.toggle('filled', !!query);
}
function esc(s){ return s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

/* ---------- events ---------- */
rowsEl.addEventListener('click', e => {
  const tr = e.target.closest('tr');
  if(tr) toggle(+tr.dataset.rank, tr);
});
rowsEl.addEventListener('keydown', e => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const tr = e.target.closest('tr');
  if(tr){ e.preventDefault(); toggle(+tr.dataset.rank, tr); }
});

const qEl = document.getElementById('q');
qEl.addEventListener('input', () => { query = qEl.value; render(); });
qEl.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    const top = visible()[0];
    if(top){ const tr = rowsEl.querySelector('tr'); toggle(top.r, tr); qEl.value = ''; query = ''; setTimeout(render, 300); }
  }
  if(e.key === 'Escape'){ qEl.value = ''; query = ''; qEl.blur(); render(); }
});

document.getElementById('showTaken').onclick = () => { showTaken = !showTaken; save(); render(); };
document.getElementById('undo').onclick = undo;
document.getElementById('reset').onclick = reset;

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if(e.key === '/' && !typing){ e.preventDefault(); qEl.focus(); qEl.select(); }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); undo(); }
  if(!typing && /^[1-7]$/.test(e.key)){ view = ORDER[+e.key - 1]; save(); render(); }
});

load();
render();
if(taken.size) flashLast(taken.size + ' players already crossed off');
</script>
</body>
</html>
